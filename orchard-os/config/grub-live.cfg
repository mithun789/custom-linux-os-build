# Orchard OS live medium boot menu
set default=0
set timeout=8
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod png
if loadfont /boot/grub/unicode.pf2 ; then
    set gfxmode=auto
    terminal_output gfxterm
    set theme=/boot/grub/themes/orchard/theme.txt
fi
serial --unit=0 --speed=115200
terminal_input --append serial
terminal_output --append serial

menuentry "Try or Install Orchard OS @VERSION@" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper quiet splash ---
    initrd /casper/initrd
}
menuentry "Orchard OS (safe graphics)" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper nomodeset quiet splash ---
    initrd /casper/initrd
}
menuentry "Orchard OS (text console, serial ttyS0)" {
    linux /casper/vmlinuz boot=casper systemd.unit=multi-user.target console=tty0 console=ttyS0,115200n8 ---
    initrd /casper/initrd
}
menuentry "Check the install medium for errors" {
    linux /casper/vmlinuz boot=casper integrity-check quiet splash ---
    initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI firmware settings" {
        fwsetup
    }
else
    menuentry "Boot from the first hard disk" {
        set root=(hd1)
        chainloader +1
    }
fi
