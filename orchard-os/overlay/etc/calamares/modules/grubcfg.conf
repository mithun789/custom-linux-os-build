# /etc/default/grub in the image already holds Orchard OS settings.
overwrite: false
prefer_grub_d: false
keep_distributor: true
kernel_params: [ "quiet", "splash" ]
defaults:
    GRUB_TIMEOUT: 3
    GRUB_DEFAULT: "0"
    GRUB_DISABLE_SUBMENU: true
    GRUB_DISABLE_RECOVERY: false
always_use_defaults: false
