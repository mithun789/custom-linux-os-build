defaultGroups:
  - name: adm
    must_exist: false
    system: true
  - name: cdrom
    must_exist: false
    system: true
  - name: sudo
    must_exist: true
    system: true
  - name: dip
    must_exist: false
    system: true
  - name: plugdev
    must_exist: false
    system: true
  - name: lpadmin
    must_exist: false
    system: true
  - name: netdev
    must_exist: false
    system: true
  - name: bluetooth
    must_exist: false
    system: true
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
passwordRequirements:
  minLength: 4
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "orchard-${cpu}"
  forbidden_names: [ localhost ]
