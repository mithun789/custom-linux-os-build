# Remove live-session-only software from the installed system.
dontChroot: false
timeout: 900
script:
  - command: "apt-get -y purge casper calamares"
    timeout: 900
  - "-apt-get -y autoremove --purge"
  - "rm -f /usr/share/applications/orchard-install.desktop"
  - "-find /etc/skel /home -name orchard-install.dockitem -delete"
