# Orchard OS compositor (picom): blur materials, rounded corners, soft shadows.
#
# Follows Apple's Human Interface Guidelines on materials: translucent
# surfaces (menu bar, dock, Spotlight, menus, sidebars) blur what is behind
# them, while text and symbols on top stay fully opaque. Translucency comes
# from the theme's RGBA backgrounds; picom adds the background blur.

backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# ---- Materials: background blur --------------------------------------------
blur-method = "dual_kawase";
blur-strength = 7;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
    "window_type = 'desktop'",
    "class_g = 'xfdesktop'",
    "class_g = 'Xfce4-screenshooter'",
    "_GTK_FRAME_EXTENTS@",
    "role = 'xborder'"
];

# ---- Rounded corners (macOS windows use about 10-12 px) --------------------
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'desktop'",
    "class_g = 'Xfce4-panel'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "window_type = 'tooltip'",
    "window_type = 'notification'",
    "_GTK_FRAME_EXTENTS@",
    "fullscreen"
];

# ---- Shadows: large and soft, slightly below the window ---------------------
shadow = true;
shadow-radius = 30;
shadow-opacity = 0.30;
shadow-offset-x = -30;
shadow-offset-y = -20;
shadow-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "class_g = 'Plank'",
    "class_g = 'Xfce4-panel'",
    "class_g = 'Xfce4-screenshooter'",
    "_GTK_FRAME_EXTENTS@",
    "fullscreen"
];

# ---- Motion: short fades, as in macOS window transitions --------------------
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.08;
fade-delta = 8;
no-fading-openclose = false;

wintypes:
{
    tooltip = { fade = true; shadow = true; focus = true; full-shadow = false; };
    dock = { shadow = false; clip-shadow-above = true; };
    dnd = { shadow = false; };
    popup_menu = { shadow = true; };
    dropdown_menu = { shadow = true; };
    notification = { shadow = true; };
};
