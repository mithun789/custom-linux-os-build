name: Orchard Agent with real models

on:
  push:
    paths: ["orchard-os/overlay/usr/lib/orchard/orchard_agent.py", ".github/workflows/agent-test.yml"]
  workflow_dispatch:

jobs:
  agent-real-model:
    # Runs Orchard Agent against real local models in Ollama.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: ["qwen3:1.7b", "qwen2.5:3b", "llama3.2:3b", "qwen3:4b"]
    steps:
      - uses: actions/checkout@v4

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -fs localhost:11434/api/version; then
            nohup ollama serve > /tmp/ollama.log 2>&1 &
            for i in $(seq 1 60); do curl -fs localhost:11434/api/version && break; sleep 1; done
          fi
          curl -fsS localhost:11434/api/version

      - name: Pull ${{ matrix.model }}
        run: ollama pull "${{ matrix.model }}"

      - name: Agent must use tools to answer
        run: |
          mkdir -p /tmp/agent-work && cd /tmp/agent-work
          python3 "$GITHUB_WORKSPACE/orchard-os/overlay/usr/lib/orchard/orchard_agent.py" \
            -p ollama -m "${{ matrix.model }}" --yolo \
            "Create a file named answer.txt in the current directory that contains the output of the command: uname -s. Then reply DONE." | tee out.txt
          echo "---- agent log ----"
          cat ~/.local/share/orchard/agent/agent.log
          echo "---- answer.txt ----"
          cat answer.txt
          grep -q "Linux" answer.txt

      - name: Speed
        if: always()
        run: |
          curl -s localhost:11434/api/generate -d '{"model":"${{ matrix.model }}","prompt":"Say hi","stream":false}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(round(d["eval_count"]/(d["eval_duration"]/1e9),1), "tokens/s on a 4-core CPU runner")'
