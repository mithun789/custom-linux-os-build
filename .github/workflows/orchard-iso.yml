name: Orchard OS ISO

on:
  push:
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths: ["orchard-os/**", ".github/workflows/orchard-iso.yml"]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Boot and install tests in QEMU"
        type: boolean
        default: true
      release_tag:
        description: "Publish a release with this tag, e.g. v1.0 (empty = no release)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo chmod 777 /mnt
          df -h / /mnt

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools python3-pil \
            librsvg2-bin imagemagick fonts-inter qemu-system-x86 qemu-utils ovmf python3-pexpect

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Build ISO
        run: sudo WORK=/mnt/orchard-build OUT="$PWD/out" ./orchard-os/build-iso.sh

      - name: Free build space before tests
        run: |
          sudo rm -rf /mnt/orchard-build
          df -h / /mnt

      - name: Test in QEMU
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: sudo python3 orchard-os/test/qemu-test.py out/*.iso --out test-results --work /mnt/orchard-test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Upload ISO (download from the run page, kept 90 days)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orchard-os-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          retention-days: 90

      - name: Split ISO for release (GitHub limit is 2 GiB per file)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        run: |
          cd out
          iso=$(ls *.iso)
          if [ "$(stat -c %s "$iso")" -gt 2000000000 ]; then
            split -b 1900M -d "$iso" "$iso.part"
            rm "$iso"
          fi
          ls -la

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Orchard OS ${{ inputs.release_tag || github.ref_name }}
          make_latest: true
          files: out/*
          body: |
            Orchard OS ${{ inputs.release_tag || github.ref_name }}. Boots on BIOS and UEFI. Write it to a USB stick with
            balenaEtcher, Rufus (DD mode) or `dd`, then pick "Install Orchard OS" on the desktop.

            If the ISO is split into `.part00`, `.part01` files, join them first:
            `cat orchard-os-*.iso.part* > orchard-os.iso` and check it with the `.sha256` file.
