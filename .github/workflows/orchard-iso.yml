name: Orchard OS ISO

on:
  push:
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths: ["orchard-os/**", ".github/workflows/orchard-iso.yml"]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Boot and install tests in QEMU"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo chmod 777 /mnt
          df -h / /mnt

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools python3-pil \
            librsvg2-bin imagemagick fonts-inter qemu-system-x86 qemu-utils ovmf python3-pexpect

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Build ISO
        run: sudo WORK=/mnt/orchard-build OUT="$PWD/out" ./orchard-os/build-iso.sh

      - name: Free build space before tests
        run: |
          sudo rm -rf /mnt/orchard-build
          df -h / /mnt

      - name: Test in QEMU
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: sudo python3 orchard-os/test/qemu-test.py out/*.iso --out test-results --work /mnt/orchard-test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Split ISO for release (GitHub limit is 2 GiB per file)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd out
          iso=$(ls *.iso)
          if [ "$(stat -c %s "$iso")" -gt 2000000000 ]; then
            split -b 1900M -d "$iso" "$iso.part"
            rm "$iso"
          fi
          ls -la

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            Orchard OS ${{ github.ref_name }}. Boots on BIOS and UEFI. Write it to a USB stick with
            balenaEtcher, Rufus (DD mode) or `dd`, then pick "Install Orchard OS" on the desktop.

            If the ISO is split into `.part00`, `.part01` files, join them first:
            `cat orchard-os-*.iso.part* > orchard-os.iso` and check it with the `.sha256` file.

  agent-real-model:
    # Runs Orchard Agent against real local models in Ollama (the ISO build
    # environment may not reach model registries).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: ["qwen2.5:1.5b", "qwen3:1.7b", "llama3.2:1b"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ollama and pull ${{ matrix.model }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama pull "${{ matrix.model }}"
      - name: Agent must use tools to answer
        run: |
          mkdir -p /tmp/agent-work && cd /tmp/agent-work
          python3 "$GITHUB_WORKSPACE/orchard-os/overlay/usr/lib/orchard/orchard_agent.py" \
            -p ollama -m "${{ matrix.model }}" --yolo \
            "Create a file named answer.txt in the current directory that contains the output of the command: uname -s. Then reply DONE." | tee out.txt
          cat ~/.local/share/orchard/agent/agent.log
          grep -q "Linux" answer.txt
      - name: Speed
        run: |
          curl -s localhost:11434/api/generate -d '{"model":"${{ matrix.model }}","prompt":"Say hi","stream":false}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["eval_count"]/(d["eval_duration"]/1e9), "tokens/s")'
